<dialog class="photo-library-picker" data-photo-library-picker data-library-url="{% url 'phototheque:photos_json' %}" aria-labelledby="photo-library-title" aria-describedby="photo-library-description">
  <div class="photo-library-dialog">
    <header class="photo-library-heading"><div><p class="photo-library-eyebrow">VOS PHOTOS, AU MÊME ENDROIT</p><h2 id="photo-library-title">Choisir une photo</h2><p id="photo-library-description">Retrouvez vos images enregistrées. Votre saisie reste conservée.</p></div><button type="button" class="photo-library-close" data-library-close aria-label="Fermer la bibliothèque">×</button></header>
    <form class="photo-library-search" data-library-search><label>Rechercher une photo<input type="search" name="q" maxlength="160" autocomplete="off" placeholder="Nom de la photo…"></label><label>Dossier<select name="folder"><option value="">Tous les dossiers</option><option value="unfiled">Sans dossier</option></select></label><button type="submit" class="photo-library-button">Rechercher</button></form>
    <p class="photo-library-status" data-library-status role="status" aria-live="polite"></p>
    <div class="photo-library-body"><div><ul class="photo-library-grid" data-library-results></ul><nav class="photo-library-pagination" aria-label="Pages des photos"><button type="button" class="photo-library-button" data-library-previous>← Précédente</button><span data-library-page></span><button type="button" class="photo-library-button" data-library-next>Suivante →</button></nav></div><aside class="photo-library-preview" data-library-preview hidden><img alt="" data-library-preview-image><h3 data-library-preview-title></h3><p data-library-preview-size></p><button type="button" class="photo-library-button" data-library-toggle>Choisir cette photo</button></aside></div>
    <footer class="photo-library-footer"><p data-library-count>Aucune photo sélectionnée.</p><div><button type="button" class="photo-library-button" data-library-close>Annuler</button><button type="button" class="photo-library-button photo-library-button-primary" data-library-confirm disabled>Utiliser la sélection</button></div></footer>
  </div>
</dialog>
