<div class="photo-field{% if field.errors %} photo-field--invalid{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="photo-required"> (obligatoire)</span>{% endif %}</label>
  {{ field }}{% if field.help_text %}<p class="photo-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}{{ field.errors }}
</div>
