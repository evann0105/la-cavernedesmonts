<div class="customer-field{% if wide %} customer-field--wide{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% for error in field.errors %}<p class="customer-field-error" role="alert">{{ error }}</p>{% endfor %}{% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}</div>
