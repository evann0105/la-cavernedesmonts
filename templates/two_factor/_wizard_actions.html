{% if cancel_url %}<a href="{{ cancel_url }}" class="btn btn-secondary">Annuler</a>{% endif %}
{% if wizard.steps.prev %}<button name="wizard_goto_step" type="submit" value="{{ wizard.steps.prev }}" class="btn btn-secondary">Retour</button>{% endif %}
<button type="submit" class="btn btn-primary">{% if wizard.steps.current == 'token' or wizard.steps.current == 'backup' %}Vérifier le code{% else %}Continuer{% endif %}</button>
