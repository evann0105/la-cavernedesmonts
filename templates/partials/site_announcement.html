{% if site_announcement %}<aside class="site-announcement" aria-label="Information de la boutique" data-site-announcement data-ends-at="{{ site_announcement.ends_at|date:'c' }}"><div class="site-announcement-inner"><span class="site-announcement-label">{{ site_announcement.get_kind_display }}</span><p>{{ site_announcement.message }}</p>{% if site_announcement.link_url %}<a href="{{ site_announcement.link_url }}">{{ site_announcement.link_label }} <span aria-hidden="true">↗</span></a>{% endif %}</div></aside>{% endif %}
