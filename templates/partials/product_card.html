{% load i18n shop_i18n %}<article class="product-card"><a href="{% url 'core:product_detail' product.slug %}" class="product-image">{% if product.image_url %}<img src="{{ product.image_url }}" alt="{{ product.localized_name }}" loading="lazy" width="600" height="800">{% else %}<span>La Caverne des Monts</span>{% endif %}<span class="card-arrow" aria-hidden="true">↗</span></a><div class="product-meta"><p class="eyebrow">{{ product.category.name|shop_text }}</p><h3><a href="{% url 'core:product_detail' product.slug %}">{{ product.localized_name }}</a></h3><p class="price">{{ product.price|floatformat:2 }} €</p></div></article>
