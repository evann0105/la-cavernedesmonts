{% load i18n %}{% get_current_language as CURRENT_LANGUAGE %}{% get_available_languages as AVAILABLE_LANGUAGES %}
<form class="language-form" action="{% url 'set_language' %}" method="post">{% csrf_token %}<input name="next" type="hidden" value="{{ request.get_full_path }}"><label for="site-language">{% translate 'Langue' %}</label><select name="language" id="site-language" aria-label="{% translate 'Langue du site' %}">{% for code, name in AVAILABLE_LANGUAGES %}<option value="{{ code }}" lang="{{ code }}" {% if code == CURRENT_LANGUAGE %}selected{% endif %}>{{ name }}</option>{% endfor %}</select><button type="submit" aria-label="{% translate 'Changer la langue' %}">OK</button></form>
