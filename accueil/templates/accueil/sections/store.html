{% load static i18n shop_i18n product_images shop_reviews %}
<section id="home-store" class="store-teaser wrap" aria-labelledby="store-teaser-title"><div class="store-teaser-photo">{% if home.images.store_image.custom %}<img src="{{ home.images.store_image.url }}" width="{{ home.images.store_image.width }}" height="{{ home.images.store_image.height }}" alt="{{ home.store.image_alt }}" loading="lazy" decoding="async">{% else %}<img src="{% static 'core/img/boutique/lelex-2400.jpg' %}" srcset="{% static 'core/img/boutique/lelex-960.jpg' %} 960w, {% static 'core/img/boutique/lelex-2400.jpg' %} 2400w" sizes="(max-width: 760px) 100vw, 70vw" width="2400" height="1594" alt="{{ home.store.image_alt }}" loading="lazy" decoding="async">{% endif %}</div><div class="store-teaser-copy"><p class="eyebrow">{{ home.store.kicker }}</p><h2 id="store-teaser-title">{{ home.store.title|linebreaksbr }}</h2><p>{{ home.store.description|linebreaksbr }}</p><a class="button" href="{{ home.store.button_url }}">{{ home.store.button_label }} <span aria-hidden="true">↗</span></a></div></section>
