<fieldset class="initial-stock-row" data-stock-row>
<legend>Variante <span data-stock-number>{{ forloop.counter|default:'nouvelle' }}</span></legend>
{{ stock_form.non_field_errors }}
<div class="initial-stock-fields">{% for field in stock_form.visible_fields %}{% if field.name != 'DELETE' %}{% include 'core/catalog/field.html' %}{% endif %}{% endfor %}</div>
<label class="catalog-check">{{ stock_form.DELETE }} Ignorer cette ligne</label>
</fieldset>
