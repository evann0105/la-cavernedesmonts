<div class="catalog-field {% if field.errors %}has-error{% endif %}">{% if field.field.widget.allow_multiple_selected %}<fieldset class="catalog-options"><legend>{{ field.label }}</legend>{{ field }}</fieldset>{% elif field.field.widget.input_type == 'checkbox' %}<label class="catalog-check">{{ field }} <span>{{ field.label }}</span></label>{% else %}{{ field.label_tag }}{{ field }}{% endif %}{% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}{{ field.errors }}</div>
